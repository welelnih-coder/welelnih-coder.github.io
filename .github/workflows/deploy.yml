name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unzip project
        run: unzip -q sunni-project.zip
      - name: Build
        working-directory: sunni
        env:
          VITE_SUPABASE_URL: https://riuucdgkawnkxxkmfunf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_jNTQiLVlerDak3eTTj0hmg_tqs_Wm6s
        run: |
          npm install
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sunni/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
